name: Self-test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions: {}

jobs:
  selftest:
    name: "TEST: basic selftest"
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
            # ubuntu-slim has no Docker daemon, but it does ship Python.
          - ubuntu-slim
          - ubuntu-22.04
    runs-on: ${{ matrix.os }}
    permissions:
      security-events: write

    steps:
      - uses: $/
        with:
          advanced-security: true
          inputs: ${{ github.repository }}

  selftest-version:
    name: "TEST: zizmor version ${{ matrix.version }}"
    strategy:
      matrix:
        version: ["1.29.0", "v1.29.0", "latest", "prerelease"]
    runs-on: ubuntu-slim
    permissions:
      security-events: write
    steps:
      - uses: $/
        with:
          advanced-security: true
          version: ${{ matrix.version }}
          inputs: ${{ github.repository }}

  selftest-version-nonexistent-xfail:
    name: "TEST: nonexistent version of zizmor (expected to fail)"
    runs-on: ubuntu-latest
    steps:
      - uses: $/
        id: zizmor
        continue-on-error: true
        with:
          advanced-security: true
          version: "9999.0.0"
          inputs: ${{ github.repository }}

      - name: assert failure
        env:
          XFAIL: ${{ steps.zizmor.outcome == 'failure' }}
          JOB_NAME: ${{ github.job }}
        run: |
          echo "xfail ${JOB_NAME}: ${XFAIL}"

          [[ "${XFAIL}" == "true" ]] || { >&2 echo "expected step to fail"; exit 1; }

  selftest-plain:
    name: "TEST: emits plan format when 'advanced-security: false'"
    runs-on: ubuntu-latest
    steps:
      - uses: $/
        with:
          advanced-security: false
          inputs: ${{ github.repository }}

  selftest-plain-gha-hazmat-xfail:
    name: "TEST: known findings in woodruffw/gha-hazmat (expected to fail when 'advanced-security: false')"
    runs-on: ubuntu-latest
    steps:
      - uses: $/
        id: zizmor
        continue-on-error: true
        with:
          advanced-security: false
          inputs: "woodruffw/gha-hazmat"

      - name: assert failure
        env:
          XFAIL: ${{ steps.zizmor.outcome == 'failure' }}
          JOB_NAME: ${{ github.job }}
        run: |
          echo "xfail ${JOB_NAME}: ${XFAIL}"

          [[ "${XFAIL}" == "true" ]] || { >&2 echo "expected step to fail"; exit 1; }

  selftest-inputs-default:
    name: "TEST: 'inputs' defaults to '.'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Omits `inputs`, so the runner applies `default: "."`. This is the only
      # step that covers that wiring.
      - uses: $/
        id: zizmor
        with:
          advanced-security: false

      # `inputs` defaults to '.', which is ${GITHUB_WORKSPACE}, and a step may
      # not redefine that. Invoke the script directly against a fixture: a
      # wrong default would audit this repository and collect more than one.
      - name: assert the default audits only the fixture
        env:
          GHA_ZIZMOR_INPUTS: "."
          GHA_ZIZMOR_VERSION: latest
          GHA_ZIZMOR_PERSONA: regular
          GHA_ZIZMOR_COLLECT: default
          GHA_ZIZMOR_ONLINE_AUDITS: "false"
          GHA_ZIZMOR_ADVANCED_SECURITY: "false"
          GHA_ZIZMOR_ANNOTATIONS: "false"
          GHA_ZIZMOR_COLOR: "false"
          GHA_ZIZMOR_TOKEN: ${{ github.token }}
          GHA_ZIZMOR_FAIL_ON_NO_INPUTS: "true"
          GHA_ZIZMOR_MIN_SEVERITY: ""
          GHA_ZIZMOR_MIN_CONFIDENCE: ""
          GHA_ZIZMOR_CONFIG: ""
        run: |
          set -euo pipefail

          export GITHUB_ACTION_PATH="${PWD}"
          export GITHUB_WORKSPACE="${PWD}/tests/default-inputs"
          export RUNNER_OS="Linux"

          out="$(bash "${GITHUB_ACTION_PATH}/action.sh" 2>&1)" \
            || { printf '%s\n' "${out}"; exit 1; }
          printf '%s\n' "${out}"

          audited="$(grep -c 'completed ' <<< "${out}")"
          [[ "${audited}" == "1" ]] \
            || { >&2 echo "expected 1 audited input (the fixture), got ${audited}"; exit 1; }

  selftest-inputs-globbing:
    name: "TEST: 'inputs' expands globs, one per line"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # three.yaml sits two directories down, so `**` has to recurse: plain
      # bash expands `**` as `*` and would find nothing.
      - uses: $/
        with:
          advanced-security: false
          inputs: |
            tests/multiple-workflows/*.yaml
            tests/**/three.yaml

  selftest-inputs-glob-no-match-xfail:
    name: "TEST: an unmatched glob is reported (expected to fail)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/
        id: zizmor
        continue-on-error: true
        with:
          advanced-security: false
          # Nothing matches, so the pattern reaches zizmor unchanged and is
          # reported instead of the run quietly auditing nothing.
          inputs: tests/**/does-not-exist.yaml

      - name: assert failure
        env:
          XFAIL: ${{ steps.zizmor.outcome == 'failure' }}
          JOB_NAME: ${{ github.job }}
        run: |
          echo "xfail ${JOB_NAME}: ${XFAIL}"

          [[ "${XFAIL}" == "true" ]] || { >&2 echo "expected step to fail"; exit 1; }

  selftest-plain-gha-hazmat-offline-audits-xfail:
    name: "TEST: known findings in woodruffw/gha-hazmat with offline audits (expected to fail when 'advanced-security: false')"
    runs-on: ubuntu-latest
    steps:
      - uses: $/
        id: zizmor
        continue-on-error: true
        with:
          advanced-security: false
          inputs: "woodruffw/gha-hazmat"
          online-audits: false

      - name: assert failure
        env:
          XFAIL: ${{ steps.zizmor.outcome == 'failure' }}
          JOB_NAME: ${{ github.job }}
        run: |
          echo "xfail ${JOB_NAME}: ${XFAIL}"

          [[ "${XFAIL}" == "true" ]] || { >&2 echo "expected step to fail"; exit 1; }

  selftest-annotations:
    name: "TEST: 'annotations: true' emits GitHub annotations"
    runs-on: ubuntu-latest
    steps:
      - uses: $/
        with:
          advanced-security: false
          annotations: true
          inputs: ${{ github.repository }}

  selftest-annotations-advanced-security-exclusive-xfail:
    name: "TEST: 'annotations: true' and 'advanced-security: true' are mutually exclusive"
    runs-on: ubuntu-latest
    steps:
      - uses: $/
        id: zizmor
        continue-on-error: true
        with:
          advanced-security: true
          annotations: true
          inputs: ${{ github.repository }}

      - name: assert failure
        env:
          XFAIL: ${{ steps.zizmor.outcome == 'failure' }}
          JOB_NAME: ${{ github.job }}
        run: |
          echo "xfail ${JOB_NAME}: ${XFAIL}"

          [[ "${XFAIL}" == "true" ]] || { >&2 echo "expected step to fail"; exit 1; }

  selftest-fail-on-no-inputs-xfail:
    name: "TEST: 'fail-on-no-inputs: true' causes failure when no inputs are collected"
    runs-on: ubuntu-latest
    steps:
      - uses: $/
        id: zizmor
        continue-on-error: true
        with:
          advanced-security: false
          inputs: woodruffw-experiments/empty

      - name: assert failure
        env:
          XFAIL: ${{ steps.zizmor.outcome == 'failure' }}
          JOB_NAME: ${{ github.job }}
        run: |
          echo "xfail ${JOB_NAME}: ${XFAIL}"

          [[ "${XFAIL}" == "true" ]] || { >&2 echo "expected step to fail"; exit 1; }

  selftest-fail-on-no-inputs-disabled:
    name: "TEST: 'fail-on-no-inputs: false' does not cause failure when no inputs are collected"
    runs-on: ubuntu-latest
    steps:
      - uses: $/
        id: zizmor
        continue-on-error: true
        with:
          advanced-security: false
          inputs: woodruffw-experiments/empty
          fail-on-no-inputs: false

  selftest-output-file-output-is-present-when-advanced-security:
    name: "TEST: 'outputs.output-file' is present when `advanced-security: true`"
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: $/
        id: zizmor
        with:
          advanced-security: true
          inputs: ${{ github.repository }}

      - name: Test output-file
        run: |
          jq < "${OUTPUT_FILE}"
        env:
          OUTPUT_FILE: ${{ steps.zizmor.outputs.output-file }}

  selftest-collect:
    name: "TEST: 'collect: actions` only collections action inputs"
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - uses: $/
        id: zizmor
        with:
          advanced-security: false
          collect: actions
          inputs: ${{ github.repository }}

      # TODO: Would be nice to grep the input or similar here to confirm we only collected `./action.yml`.

  all-selftests-pass:
    if: always()

    needs:
      - selftest
      - selftest-version
      - selftest-version-nonexistent-xfail
      - selftest-plain
      - selftest-plain-gha-hazmat-xfail
      - selftest-inputs-default
      - selftest-inputs-globbing
      - selftest-inputs-glob-no-match-xfail
      - selftest-plain-gha-hazmat-offline-audits-xfail
      - selftest-annotations
      - selftest-annotations-advanced-security-exclusive-xfail
      - selftest-fail-on-no-inputs-xfail
      - selftest-fail-on-no-inputs-disabled
      - selftest-output-file-output-is-present-when-advanced-security
      - selftest-collect

    runs-on: ubuntu-latest

    steps:
      - name: check test jobs
        if: (github.event_name != 'pull_request') || !github.event.pull_request.head.repo.fork
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
